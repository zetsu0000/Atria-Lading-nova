<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A Atria fortalece como dermatologistas são percebidos, encontrados e compreendidos: posicionamento, linguagem, conteúdo e encontrabilidade na mesma direção."
    />
    <title>Atria | Presença digital para dermatologistas</title>

    <!-- Compartilhamento. Sem og:image e og:url por ora: ambos exigem URL
         absoluta, e o domínio oficial ainda não está confirmado aqui. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atria" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Atria | Presença digital para dermatologistas" />
    <meta
      property="og:description"
      content="A Atria fortalece como dermatologistas são percebidos, encontrados e compreendidos: posicionamento, linguagem, conteúdo e encontrabilidade na mesma direção."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Atria | Presença digital para dermatologistas" />
    <meta
      name="twitter:description"
      content="A Atria fortalece como dermatologistas são percebidos, encontrados e compreendidos: posicionamento, linguagem, conteúdo e encontrabilidade na mesma direção."
    />

    <!-- Entidade da marca. `Organization` — nunca `MedicalOrganization`,
         `MedicalClinic` ou `Physician`: a Atria não presta atendimento médico.
         Só descreve o que está visível na página. Completar `url`, `logo` e
         `sameAs` (perfis oficiais) quando o domínio for confirmado. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Atria",
        "description": "A Atria fortalece a presença digital de dermatologistas: posicionamento, linguagem, conteúdo e encontrabilidade na mesma direção.",
        "email": "contato@atria.com",
        "areaServed": "BR",
        "knowsAbout": [
          "Posicionamento de marca",
          "Presença digital",
          "Conteúdo editorial",
          "Encontrabilidade",
          "SEO"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Stack+Sans+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
