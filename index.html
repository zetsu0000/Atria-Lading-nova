<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A Atria organiza posicionamento, linguagem, conteúdo e busca para construir uma presença digital clara, coerente e reconhecível para dermatologistas."
    />
    <title>Atria | Presença digital para dermatologistas</title>
    <link rel="canonical" href="https://atria-studios.com/" />

    <!-- Compartilhamento. O domínio oficial agora está confirmado, então og:url
         e og:image deixam de ficar em aberto. A imagem é JPEG e não WebP de
         propósito: o preview de link do WhatsApp — o canal de contato da marca
         — não renderiza WebP de forma confiável. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atria" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://atria-studios.com/" />
    <meta property="og:title" content="Atria | Presença digital para dermatologistas" />
    <meta
      property="og:description"
      content="A Atria organiza posicionamento, linguagem, conteúdo e busca para construir uma presença digital clara, coerente e reconhecível para dermatologistas."
    />
    <meta property="og:image" content="https://atria-studios.com/og-atria.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta
      property="og:image:alt"
      content="Retrato em close sob luz difusa, atrás de um painel de vidro."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atria | Presença digital para dermatologistas" />
    <meta name="twitter:image" content="https://atria-studios.com/og-atria.jpg" />
    <meta
      name="twitter:description"
      content="A Atria organiza posicionamento, linguagem, conteúdo e busca para construir uma presença digital clara, coerente e reconhecível para dermatologistas."
    />

    <!-- Entidade da marca. `Organization` — nunca `MedicalOrganization`,
         `MedicalClinic` ou `Physician`: a Atria não presta atendimento médico.
         Só descreve o que está visível na página. Falta `sameAs`, que só deve
         entrar quando existirem perfis oficiais reais para listar. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Atria",
        "url": "https://atria-studios.com/",
        "description": "A Atria organiza posicionamento, linguagem, conteúdo e busca para construir uma presença digital clara, coerente e reconhecível para dermatologistas.",
        "email": "contato@atria-studios.com",
        "telephone": "+5511975443446",
        "areaServed": "BR",
        "knowsAbout": [
          "Posicionamento de marca",
          "Presença digital",
          "Conteúdo editorial",
          "Encontrabilidade",
          "SEO"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Stack+Sans+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
